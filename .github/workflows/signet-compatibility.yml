name: Signet Compatibility
run-name: Signet compatibility ${{ inputs.signet_login_ref || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      signet_login_ref:
        description: Signet Login ref or release tag requesting compatibility
        required: false
        type: string
      signet_login_sha:
        description: Signet Login commit SHA requesting compatibility
        required: false
        type: string
      request_id:
        description: Compatibility request id
        required: false
        type: string

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check:signet-login
      - run: npm run check:signet-conformance
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:app
      - run: npx vitest run --coverage
      - run: npx playwright install --with-deps chromium webkit

      - name: Run Signet NostrConnect browser regression
        run: npm run test:e2e:signet

      - name: Run Signet WebKit regression
        run: npm run test:e2e:signet:webkit

      - name: Run protocol E2E suite
        run: npm run test:e2e:protocol
