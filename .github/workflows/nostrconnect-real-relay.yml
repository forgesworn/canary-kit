name: NostrConnect Real Relay Smoke

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:signet-login
      - run: npx playwright install --with-deps chromium
      - name: Run production Canary and Signet through public Nostr relay
        env:
          NOSTRCONNECT_REAL_RELAY: ${{ vars.NOSTRCONNECT_REAL_RELAY }}
        run: npm run test:e2e:real-relay
      - uses: actions/upload-artifact@2848b2cda0e5190984587ec6bb1f36730ca78d50 # v4.6.2
        if: failure()
        with:
          name: playwright-real-relay-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
