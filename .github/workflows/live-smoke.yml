name: Production Live Smoke

on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-live-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:signet-login
      - run: npx playwright install --with-deps chromium
      - name: Run deployed Canary and Signet smoke
        run: npm run test:e2e:live-smoke
      - uses: actions/upload-artifact@2848b2cda0e5190984587ec6bb1f36730ca78d50 # v4.6.2
        if: failure()
        with:
          name: playwright-live-smoke-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
