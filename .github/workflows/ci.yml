name: CI
on:
  push:
    branches: [main, dev, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check:signet-login
      - run: npm run check:signet-conformance
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:local
      - run: npm run build
      - run: npm run build:app
      - run: npx vitest run --coverage
      - run: npx playwright install --with-deps chromium webkit
      - name: Build Vouch web fixtures
        run: npm run build:local -- --fixtures
      - name: Check moving QR setup and encrypted copies
        run: node tools/test-optical-vouch.mjs
      - name: Build Vouch native web bundle
        run: npm run build:local -- --native
      - name: Check native bridge fixtures
        run: node tools/test-native-vouch.mjs
      - name: Check native package validation
        run: python3 native/test_check_builds.py
      - name: Run Signet NostrConnect browser regression
        run: npm run test:e2e:signet
      - name: Run Signet WebKit regression
        run: npm run test:e2e:signet:webkit
      - name: Run protocol E2E suite
        run: npm run test:e2e:protocol

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:app
      # The key is accepted only by rrsync, write-only, into this site's folder.
      - name: Deploy to canary.trotters.cc
        env:
          SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
          SITE_DEPLOY_HOST: ${{ secrets.SITE_DEPLOY_HOST }}
          SITE_DEPLOY_KNOWN_HOSTS: ${{ secrets.SITE_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SITE_DEPLOY_KEY" > ~/.ssh/site_deploy
          printf '%s\n' "$SITE_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/site_deploy ~/.ssh/known_hosts
          rsync -rlz --delete --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/site_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            docs/ "site-deploy@${SITE_DEPLOY_HOST}:/"
      - run: npx playwright install --with-deps chromium
      - name: Run live Canary and Signet smoke
        run: npm run test:e2e:live-smoke
